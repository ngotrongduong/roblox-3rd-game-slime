<!doctype html>
<meta charset="utf-8">
<title>carry</title>
<script>
// Carries pictures (?f=path1,path2 from the repo root) to chatgpt.com in this same tab, inside the
// address's hash (a hash is never sent to a server). ChatGPT's page cannot fetch or frame
// 127.0.0.1 and the pane has no file upload, so this is the way in (skill chatgpt-review). Each
// picture is made at most 1400 wide (JPEG 0.85) so several fit in one address (Chrome: 2 MB).
(async () => {
  const names = new URLSearchParams(location.search).get('f').split(',');
  const parts = [];
  for (const n of names) {
    const img = new Image();
    // (the load event, not img.decode(): decode() never settles while the browser pane is hidden)
    await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = '/' + n + '?t=' + Date.now(); });
    // (a new chat's address takes less than a chat's: &w=1000 makes them smaller)
    const w = Math.min(Number(new URLSearchParams(location.search).get('w')) || 1400, img.naturalWidth);
    const c = document.createElement('canvas');
    c.width = w;
    c.height = Math.round(img.naturalHeight * w / img.naturalWidth);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    parts.push(encodeURIComponent(n.split('/').pop()) + '|' + c.toDataURL('image/jpeg', 0.8).split(',')[1]);
  }
  // It lands on chatgpt.com's light static page (robots.txt: the app with a ~1 MB address fails
  // to load); a script there keeps the pictures in sessionStorage and opens the chat: &to=/c/<id>
  // for a follow-up, else a new chat.
  // &p=<text file> carries the message too (as &prompt= before the pictures), so a long brief never has to be typed
  // into a javascript call; tools/chatgpt/views.py writes such files.
  const to = new URLSearchParams(location.search).get('to') || '/';
  const p = new URLSearchParams(location.search).get('p');
  const prompt = p ? '&prompt=' + encodeURIComponent((await (await fetch('/' + p + '?t=' + Date.now())).text()).trim()) : '';
  location.href = 'https://chatgpt.com/robots.txt#to=' + encodeURIComponent(to) + prompt + '&review=' + parts.join('~');
})();
</script>
